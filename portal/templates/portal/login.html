{% extends "portal/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card"><div class="card-body p-4">
      <h4 class="mb-3">Log in</h4>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input class="form-control" name="username" id="id_username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          <input class="form-control" type="password" name="password" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0 small text-muted">No account? <a href="{% url 'portal:register' %}">Register</a>. Demo logins are listed in the README.</p>
    </div></div>
  </div>
</div>
{% endblock %}
